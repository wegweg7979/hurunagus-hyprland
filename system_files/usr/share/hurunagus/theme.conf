# Hurunagus look and feel: which theme and wallpaper the desktop should start on.
# Read by omarchy-hurunagus-configs. Applied after the config payload is seeded,
# so a re-run always lands on the same theme + wallpaper rather than whatever
# the theme switcher cycled to last.
#
# THEME       Omarchy theme name (as `omarchy theme list` prints it).
# BACKGROUND  Path relative to ~/.config/omarchy/backgrounds/, or absolute.
#             Comment it out to let the theme pick (omarchy-theme-set cycles).

THEME="tokyo-night"
BACKGROUND="tokyo-night/henge.png"
