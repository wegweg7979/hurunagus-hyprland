# Administrator customizations go in this file
#
# Select the spinner theme instead of the image default (bgrt, which just shows
# the firmware/vendor logo) so the boot splash renders the Hurunagus watermark:
# system_files/usr/share/plymouth/themes/spinner/watermark.png overrides the
# stock Fedora logo in the spinner theme's ImageDir, which the two-step plugin
# displays above the spinner.
#
# This file matters twice over: plymouthd reads it at runtime, and dracut's
# 45plymouth module parses it when building the initramfs (it prefers this file
# over /usr/share/plymouth/plymouthd.defaults). So it must be in place before the
# initramfs is generated at the end of build.sh -- system_files/ is copied
# earlier in that script, which keeps the ordering correct.
#
# Note: /usr/share/plymouth/themes/spinner/watermark.png is owned by
# fedora-logos, so our copy shows up as a modified file to
# `rpm -V fedora-logos`. That is expected and harmless on an image-based OS:
# the image content is what gets deployed.

[Daemon]
Theme=spinner
ShowDelay=0
