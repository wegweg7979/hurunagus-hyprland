---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron:  "00 06 * * 2" # build at 06:00 UTC every tuesday
        # (20 minutes after last ublue images start building)
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      fresh:
        description: "Rebuild every layer and re-resolve the CachyOS kernel (ignores the layer cache)"
        type: boolean
        default: false
      rechunk:
        description: "Also split the image for smaller delta updates (adds ~10 minutes)"
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      # write, not read: the weekly job commits the kernel pin only once the image
      # built with it has been pushed and signed (last step of the job).
      contents: write
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      #
      # It runs before the build (not after, as the template had it) because the
      # build pushes its layer cache to this same registry.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Secure Boot signing key. It has to reach the image build as a podman
      # build secret, never as a build arg -- build args are recorded in the
      # image config and layer history. Pull requests (including forks) receive no
      # secrets at all, so they build with signing switched OFF; that image is
      # never published. On the published branch a missing key is a hard failure,
      # because the alternative is publishing a kernel that Secure Boot would
      # refuse while every log line looks green.
      - name: Prepare Secure Boot signing key
        id: sb-signing-key
        env:
          SB_SIGNING_KEY: ${{ secrets.SB_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SB_SIGNING_KEY:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "SB_SIGNING=off" >> "${GITHUB_ENV}"
              echo "::warning::SB_SIGNING_KEY is unavailable in this pull request: building with Secure Boot signing OFF (this image is not published)"
            else
              echo "::error::SB_SIGNING_KEY is not set, so the kernel would ship unsigned -- refusing to build the published image"
              exit 1
            fi
          else
            SB_KEY_FILE="${RUNNER_TEMP}/hurunagus-kernel.key"
            printf '%s\n' "${SB_SIGNING_KEY}" > "${SB_KEY_FILE}"
            chmod 600 "${SB_KEY_FILE}"
            echo "SB_SIGNING_KEY_FILE=${SB_KEY_FILE}" >> "${GITHUB_ENV}"
            echo "Secure Boot signing key materialized (${#SB_SIGNING_KEY} characters)"
          fi

      # The pin is a deliberate choice, so the weekly run asks the COPR what it is
      # offering BEFORE the build and hands it over as a candidate. Nothing else
      # moves the pin: an ordinary push builds the pin already committed, which is
      # how a new kernel arrives on a Tuesday or not at all. Resolved here rather
      # than inside the build because this job needs the value afterwards.
      - name: Resolve the kernel the weekly build should try
        id: kernel
        if: github.event_name == 'schedule' || inputs.fresh
        run: |
          set -euo pipefail
          current=$(sed -n 's/^ARG KERNEL_PIN=//p' Containerfile | head -1)
          # rootful podman, like every other step here, so this reuses the image
          # the build is about to use instead of pulling a second copy of it.
          candidate=$(sudo podman run --rm ghcr.io/ublue-os/base-main:latest bash -c \
            'dnf5 -y copr enable bieszczaders/kernel-cachyos >/dev/null &&
             dnf5 repoquery --available --latest-limit=1 --arch x86_64 --qf "%{evr}" kernel-cachyos' \
            | tail -1 | tr -d "\r\n")
          if [[ -z "${candidate}" ]]; then
            echo "::error::could not resolve a kernel from the COPR"; exit 1
          fi
          echo "current=${current}"     >> "$GITHUB_OUTPUT"
          echo "candidate=${candidate}" >> "$GITHUB_OUTPUT"
          if [[ "${candidate}" == "${current}" ]]; then
            echo "Already pinned at ${current}; the build re-resolves the same NEVRA."
          else
            echo "::notice::kernel move available: ${current} -> ${candidate}"
          fi

      # This actually builds the container image
      - name: Build Image
        id: build-image
        env:
          # The omedora COPR mutates between image builds of the same git commit,
          # so the Omedora payload must always be re-resolved -- but that alone
          # used to cost a full --no-cache rebuild. The Containerfile is split
          # into a stable base layer, a kernel layer and a volatile tail, so bust
          # just the tail on every build. A scheduled or "fresh" run also sets
          # ALL_BUST/KERNEL_BUST, which is exactly the old --no-cache behaviour.
          # KERNEL_PIN only ever rides in on a scheduled or "fresh" run, with the
          # version resolved above -- that is the single lever that moves the kernel.
          EXTRA_BUILD_ARGS: "--build-arg OMEDORA_BUST=${{ github.run_id }}${{ (github.event_name == 'schedule' || inputs.fresh) && format(' --build-arg ALL_BUST={0} --build-arg KERNEL_BUST={0}', github.run_id) || '' }}${{ steps.kernel.outputs.candidate && format(' --build-arg KERNEL_PIN={0}', steps.kernel.outputs.candidate) || '' }}"
          # Registry layer cache. Bare repository (no tag) -- podman writes its
          # cache manifests under its own tag. Only enabled where the job has a
          # registry login: anonymous cache pulls of a private package would fail
          # the build, and a push without a token certainly would.
          BUILD_CACHE_REF: ${{ (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && format('{0}/{1}', env.IMAGE_REGISTRY, env.IMAGE_NAME) || '' }}
          BUILD_CACHE_PUSH: ${{ (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && '1' || '0' }}
        run: |
          # The Secure Boot signature's KEY reaches the build as the podman
          # secret materialized above (SB_SIGNING_KEY_FILE); only the on/off
          # switch rides in EXTRA_BUILD_ARGS. sudo -E so both reach the recipe.
          export EXTRA_BUILD_ARGS="${EXTRA_BUILD_ARGS} --build-arg SB_SIGNING=${SB_SIGNING:-on}"
          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        # ~10 minutes of the run, spent purely on smaller client-side deltas.
        # Pay for it on the weekly scheduled build (what people actually update
        # from) and on explicit request; a push-driven dev build skips it.
        if: github.event_name == 'schedule' || inputs.rechunk
        run: |
          sudo -E $(command -v just) ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    sudo -E $(command -v just) rechunk \
       #     ${IMAGE_NAME} \
       #     ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            sudo -E podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      # The pin moves here and only here, and only once the image carrying that
      # kernel has been built, pushed and signed above. Any earlier failure means the
      # candidate was never proven, so nothing is committed and the old pin stands:
      # a bad kernel week costs one failed Tuesday run, not a blocked build.
      - name: Pin the kernel this image was built with
        if: success() && (github.event_name == 'schedule' || inputs.fresh) && steps.kernel.outputs.candidate != '' && steps.kernel.outputs.candidate != steps.kernel.outputs.current
        run: |
          set -euo pipefail
          candidate='${{ steps.kernel.outputs.candidate }}'
          sed -i "s|^ARG KERNEL_PIN=.*|ARG KERNEL_PIN=${candidate}|" Containerfile
          if git diff --exit-code Containerfile >/dev/null; then
            echo "Containerfile already pins ${candidate}"; exit 0
          fi
          git config user.name  "hurunagus-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "kernel: pin ${candidate} (weekly bump) [skip ci]" Containerfile
          # Someone may push while this runs; retry on a rejected push instead of
          # losing the pin. Pushes made with GITHUB_TOKEN do not start workflows, so
          # this cannot loop back into another build.
          for attempt in 1 2 3; do
            if git push; then echo "pinned ${candidate}"; exit 0; fi
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "::warning::could not push the kernel pin; the next weekly run retries"

